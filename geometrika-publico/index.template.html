<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Geo Lab · Data Lab</title>
<link rel="icon" href="geometrika-logo.png?v=2409">
<link rel="stylesheet" href="geometrika.css?v=__V__">
<style>
html,body{margin:0;background:#f1f5f9;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0f172a}
.gp-login{position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 20%,#312e81,transparent 55%),radial-gradient(circle at 80% 80%,#0e7490,transparent 55%),#0b1020}
.gp-login.hidden{display:none}
.gp-card{background:#fff;border-radius:18px;padding:34px 30px 26px;max-width:380px;width:100%;text-align:center;box-shadow:0 14px 40px rgba(2,6,23,.4)}
.gp-img{height:96px;width:auto;max-width:100%;display:block;margin:0 auto 16px}.gp-lg{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#6366f1,#06b6d4);display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;margin:0 auto 14px;box-shadow:0 4px 14px rgba(99,102,241,.5)}
.gp-card h2{margin:0 0 4px;font-size:20px;font-weight:700}.gp-card p.s{margin:0 0 18px;font-size:13px;color:#64748b}
.gp-card input{width:100%;box-sizing:border-box;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:10px;background:#fff;font:500 15px system-ui,sans-serif;text-align:center;letter-spacing:3px;outline:none;margin-bottom:12px}
.gp-card input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.gp-card button{width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;font:700 14px system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(99,102,241,.35)}
.gp-err{color:#dc2626;font-size:12px;margin:0 0 10px;min-height:16px}
.gp-v{margin-top:14px;font-size:11px;color:#94a3b8}
.gp-wrap{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:stretch;width:100%;max-width:840px;max-height:100%;overflow:auto}
.gp-wrap .gp-card{flex:1 1 320px;max-width:400px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s,box-shadow .2s}
.gp-wrap .gp-card:hover{transform:translateY(-3px);box-shadow:0 20px 50px rgba(2,6,23,.5)}
.gp-top{min-height:112px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.gp-top .gp-img{margin:0;object-fit:contain}.gp-top .gp-img.dl{height:auto;width:min(100%,310px)}
.gp-card.dl input:focus{border-color:#0891b2;box-shadow:0 0 0 3px rgba(8,145,178,.18)}
.gp-card.dl button{background:linear-gradient(135deg,#0891b2,#0e7490);box-shadow:0 4px 14px rgba(8,145,178,.35)}
.gp-card button:hover{filter:brightness(1.06)}.gp-card button:active{transform:translateY(1px)}
.gp-login.aut .gp-card input{display:none}.gp-login.aut .gp-card .s::after{content:" · sesión iniciada"}
@media (max-width:700px){.gp-wrap{gap:14px}.gp-card{padding:26px 22px 20px}}
</style>
</head>
<body>
<div id="gpLogin" class="gp-login">
  <div class="gp-wrap">
    <div class="gp-card" data-sys="geo">
      <div>
        <div class="gp-top"><img class="gp-img" src="geometrika-logo.png?v=2409" alt="Geo Lab · GeoMetrika Geo-Intelligence"></div>
        <h2>Sistema de Geo-Inteligencia</h2>
        <p class="s">acceso restringido</p>
      </div>
      <div>
        <input type="password" id="gpPass" placeholder="Contraseña" autocomplete="current-password" autofocus>
        <p class="gp-err" id="gpErr"></p>
        <button type="button" id="gpGo">Entrar a Geo Lab</button>
        <div class="gp-v">v.Beta.__V__ · Check Inn</div>
      </div>
    </div>
    <div class="gp-card dl" data-sys="data">
      <div>
        <div class="gp-top"><img class="gp-img dl" src="datalab-logo.png?v=__DL__" alt="Data Lab"></div>
        <h2>Sistema de Datos y Fuentes</h2>
        <p class="s">acceso restringido</p>
      </div>
      <div>
        <input type="password" id="gpPass2" placeholder="Contraseña" autocomplete="current-password">
        <p class="gp-err" id="gpErr2"></p>
        <button type="button" id="gpGo2">Entrar a Data Lab</button>
        <div class="gp-v">v.Beta.1 · Check Inn</div>
      </div>
    </div>
  </div>
</div>
<div id="geometrika-host" style="display:none"></div>
<div id="datalab-host" style="display:none"></div>
<script src="/admin/gm-auth.js?v=2"></script>
<script>
const BACKEND = "https://api.check-inn.mx", GP_HASH = "__HASH__", GP_HASH2 = "__HASH2__";  // GP_HASH2: nivel con precios reales
function gpNivel(n) { window.GM_PRECIOS = n === "2"; }
window.GM_MAQ = "/admin/maqueta/entorno.html"; window.GM_PUBLICO = true;
window.GM_SALIR = function () { try { sessionStorage.removeItem("gp_ok"); sessionStorage.removeItem("gp_sys"); } catch (_) { } location.reload(); };
window.DL_SALIR = window.GM_SALIR;
window.DL_CAMBIAR = function () { try { sessionStorage.removeItem("gp_sys"); } catch (_) { } location.reload(); };
window._rsvEnsureLeaflet_ = function (cb) {
  if (window.L) return cb();
  const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(l);
  const s = document.createElement("script"); s.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"; s.onload = cb; document.head.appendChild(s);
};
async function gpSha(t) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
function gpAut() { try { const n = sessionStorage.getItem("gp_ok"), t = JSON.parse(localStorage.getItem("gmTok") || "null"); return (n === "1" || n === "2") && t && t.exp > Date.now() ? n : ""; } catch (_) { return ""; } }
function gpCarga(src, cb) { const s = document.createElement("script"); s.src = src; s.onload = cb; document.body.appendChild(s); }
function gpAbre(sys) {
  try { sessionStorage.setItem("gp_sys", sys); } catch (_) { }
  document.getElementById("gpLogin").classList.add("hidden");
  if (sys === "data") {
    document.getElementById("datalab-host").style.display = "";
    const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "datalab.css?v=__DL__"; document.head.appendChild(l);
    gpCarga("datalab-fuentes.js?v=__DL__", () => gpCarga("datalab.js?v=__DL__", () => window.datalabInit && window.datalabInit()));
  } else {
    document.getElementById("geometrika-host").style.display = "";
    gpCarga("geometrika.js?v=__V__", () => window.geometrikaInit && window.geometrikaInit());
  }
}
async function gpEntra(sys) {
  const inp = document.getElementById(sys === "data" ? "gpPass2" : "gpPass"), e = document.getElementById(sys === "data" ? "gpErr2" : "gpErr"), v = inp.value.trim(); if (!v) { e.textContent = "Captura tu contraseña."; return; }
  const h = await gpSha(v), n = h === GP_HASH2 ? "2" : h === GP_HASH ? "1" : "";
  if (n) { try { sessionStorage.setItem("gp_ok", n); } catch (_) { } let tk = null; try { const r = await fetch("https://api.check-inn.mx/geometrika/acceso", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ clave: v }) }); tk = await r.json(); } catch (_) { }
    if (!(tk && tk.ok && tk.token)) { try { sessionStorage.removeItem("gp_ok"); } catch (_) { } e.textContent = "No se pudo validar el acceso con el servidor. Intenta de nuevo."; return; }
    window.gmGuarda(tk); try { const g = JSON.parse(localStorage.getItem("gmTok") || "null"); if (!(g && g.token)) throw 0; } catch (_) { try { sessionStorage.removeItem("gp_ok"); } catch (_) { } e.textContent = "Tu navegador no permite guardar el acceso (¿modo privado?). Desactívalo e intenta de nuevo."; return; }
    gpNivel(n); gpAbre(sys); } else { e.textContent = "Contraseña incorrecta."; inp.select(); }
}
// cada tarjeta entra a su sistema; con la sesión ya iniciada basta un clic (la misma contraseña sirve para los dos)
function gpClic(sys) { const n = gpAut(); if (n) { gpNivel(n); gpAbre(sys); } else gpEntra(sys); }
document.getElementById("gpGo").onclick = () => gpClic("geo"); document.getElementById("gpGo2").onclick = () => gpClic("data");
document.getElementById("gpPass").onkeydown = e => { if (e.key === "Enter") gpClic("geo"); }; document.getElementById("gpPass2").onkeydown = e => { if (e.key === "Enter") gpClic("data"); };
{ const n = gpAut(); if (n) { let s = ""; try { s = sessionStorage.getItem("gp_sys") || ""; } catch (_) { } gpNivel(n); if (s === "geo" || s === "data") gpAbre(s); else { document.getElementById("gpLogin").classList.add("aut"); document.getElementById("gpGo").textContent = "Abrir Geo Lab →"; document.getElementById("gpGo2").textContent = "Abrir Data Lab →"; } } }
</script>
</body>
</html>
