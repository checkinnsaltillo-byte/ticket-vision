<style>
  :root{color-scheme:light}

  #dock .ch,.pwin .ch{transition:transform .15s;color:#64748b}#dock .col .db,.pwin .col .db{display:none}#dock .col .ch,.pwin .col .ch{transform:rotate(-90deg)}#dock .db,.pwin .db{margin-top:6px;max-height:46vh;overflow:auto}

  #gw-t{position:absolute;left:-14px;top:50%;width:14px;height:64px;margin-top:-32px;background:#1b2433;border:1px solid rgba(255,255,255,.14);border-right:0;border-radius:8px 0 0 8px;cursor:ew-resize;z-index:4;touch-action:none;display:flex;align-items:center;justify-content:center;color:#7b8798;font-size:10px;letter-spacing:-2px}#gw-t:hover{background:#26324a;color:#cbd5e1}
  #gw-open{display:none!important}
  #gw-open{position:fixed;top:12px;right:12px;z-index:6;border:0;border-radius:99px;padding:7px 14px;background:rgba(13,17,25,.88);color:#e2e8f0;font:600 12px Inter,sans-serif;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.12)}#gw-open:hover{background:#26324a}
  #gw.lt{background:#f1f4f9;box-shadow:-12px 0 40px rgba(0,0,0,.18),0 0 0 1px rgba(15,23,42,.1)}#gw.lt #gw-h{background:linear-gradient(180deg,#fff,#eef1f6);color:#334155}#gw.lt #gw-h button{color:#64748b}#gw.lt #gw-l{color:#64748b;text-shadow:0 1px 3px #fff}#gw.lt #gw-t{background:#e2e8f0;border-color:rgba(15,23,42,.15);color:#64748b}
  #gw-h{cursor:default;padding:6px 12px;color:#cbd5e1;font-weight:600;font-size:11px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));user-select:none;touch-action:none}

  #dock .btnrow>button:hover,#dock .seg button:hover,.pwin .btnrow>button:hover,.pwin .seg button:hover{background:rgba(15,23,42,.14)}#dock .btnrow>button.on,#dock .seg button.on,.pwin .btnrow>button.on,.pwin .seg button.on{background:#0f172a;color:#fff}
  #dock .seg,.pwin .seg{display:flex;gap:3px;align-items:center;flex-wrap:wrap;margin-top:6px;padding:0;background:none;border-radius:0}#dock .seg b,.pwin .seg b{font-size:12px;margin-right:2px}#dock button.rec,.pwin button.rec{color:#b91c1c}
  #dock #frp,.pwin #frp{position:static!important;left:auto!important;right:auto!important;top:auto!important;width:auto!important;max-width:none!important;max-height:none!important;background:none!important;box-shadow:none!important;padding:0!important;border-radius:0!important;margin-top:8px;overflow:visible!important;backdrop-filter:none!important}
  #cap .sub{margin:2px 0 6px 9px;padding-left:10px;border-left:2px solid #e2e8f0}
  #tf-win{position:fixed;top:64px;right:14px;width:420px;max-height:80vh;z-index:6;background:rgba(255,255,255,.97);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.35),0 0 0 1px rgba(15,23,42,.08);display:none;overflow:hidden;font-size:12px;color:#334155}#tf-h{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;cursor:move;background:linear-gradient(180deg,#fff,#eef1f6);user-select:none;touch-action:none}#tf-h button{all:unset;cursor:pointer;padding:2px 7px;border-radius:99px;font-size:10.5px;color:#475569;margin-left:2px}#tf-h{white-space:nowrap;gap:8px}#tf-h b{overflow:hidden;text-overflow:ellipsis}#tf-h button.on{background:#0f172a;color:#fff}#tf-b{max-height:calc(80vh - 40px);overflow:auto;padding:4px 12px 12px}.tf-c{border:1px solid #e2e8f0;border-radius:10px;padding:8px 10px;margin-top:8px;background:#fff}.tf-hm{display:grid;gap:2px;align-items:center;margin-top:6px}.tf-hm i{display:block;height:15px;border-radius:2px;cursor:pointer}.tf-bc{cursor:pointer}.tf-hm i:hover,.tf-bc:hover i{filter:brightness(.85)}.tf-hd{font-size:9.5px;color:#64748b}.tf-bars{display:grid;gap:2px;height:46px;align-items:end;margin-top:6px}.tf-bc{display:flex;align-items:flex-end;height:100%}.tf-bc i{display:block;width:100%;background:#dc2626;opacity:.72;border-radius:3px 3px 0 0}.tf-bu{align-self:start;font-size:8.5px;color:#94a3b8;line-height:1}.tf-hx{display:grid;gap:2px;font-size:8.5px;color:#94a3b8;margin-top:2px;text-align:center}#trf .btnrow button{all:unset;cursor:pointer;padding:3px 9px;border-radius:99px;background:#f1f5f9;color:#475569;font-size:11.5px}
  .ck{display:flex;align-items:center;padding:4px 2px;cursor:pointer;font-size:12px;color:#334155;user-select:none}.ck:hover{background:rgba(15,23,42,.05);border-radius:6px}
  .ck .bx{flex:none;display:inline-block;width:18px;height:18px;border:2px solid #94a3b8;border-radius:5px;text-align:center;line-height:15px;font-size:13px;font-weight:900;color:transparent;margin-right:8px;box-sizing:border-box}.ck.on .bx{background:#0f172a;border-color:#0f172a;color:#fff}

  /* ───────── Panel izquierdo (rediseño): riel oscuro con tarjetas de cristal, acordeones animados y controles reactivos ───────── */
  :root{--ac1:#6366f1;--ac2:#06b6d4;--ink:#0f172a;--mut:#64748b;--ln:#e2e8f0}
  #dock{width:356px;padding:0 12px 16px;gap:10px;background:linear-gradient(180deg,rgba(8,13,26,.95),rgba(15,23,42,.9) 60%,rgba(10,16,32,.94));backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border-right:1px solid rgba(148,163,184,.18);box-shadow:10px 0 44px rgba(2,6,23,.38);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s;scrollbar-width:thin;scrollbar-color:rgba(148,163,184,.4) transparent}
  #dock::-webkit-scrollbar{width:8px}#dock::-webkit-scrollbar-thumb{background:rgba(148,163,184,.35);border-radius:99px}#dock::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.6)}

  #dock.off{transform:translateX(-102%);opacity:0;pointer-events:none!important}

  #tt{position:sticky;top:0;z-index:3;margin:0 -12px;padding:16px 16px 12px;background:linear-gradient(180deg,rgba(8,13,26,.98),rgba(8,13,26,.9));border-bottom:1px solid rgba(148,163,184,.16);color:#f8fafc;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;pointer-events:auto;display:flex;flex-direction:column;gap:3px}

  #tt .tt-tools{position:absolute;right:12px;top:12px;display:flex;gap:4px}
  #tt .tt-tools button{all:unset;cursor:pointer;width:26px;height:26px;border-radius:8px;text-align:center;line-height:26px;font-size:13px;color:#94a3b8;background:rgba(148,163,184,.12);transition:all .15s;letter-spacing:0}
  #tt .tt-tools button:hover{background:rgba(99,102,241,.35);color:#fff;transform:translateY(-1px)}
  #notas{font-size:11.5px;color:#334155}#notas b{color:#0f172a}
  #dock>#pdi,#dock>#vue,#dock>#notas,#dock>#cap,#dock>#frm,#dock>#rgp,#dock>#trf,#dock>#tools,#dock>#frp{background:rgba(255,255,255,.97)!important;border-radius:16px!important;padding:0!important;box-shadow:0 10px 28px rgba(2,6,23,.32),0 0 0 1px rgba(255,255,255,.06)!important;overflow:hidden;transition:transform .2s,box-shadow .25s;position:relative}
  #dock>#pdi:hover,#dock>#vue:hover,#dock>#notas:hover,#dock>#cap:hover,#dock>#frm:hover,#dock>#rgp:hover,#dock>#trf:hover,#dock>#tools:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(2,6,23,.4),0 0 0 1px rgba(99,102,241,.35)!important}
  #dock .dh,.pwin .dh{padding:12px 14px;font-size:12.5px;font-weight:800;letter-spacing:.01em;color:var(--ink);background:linear-gradient(90deg,#f8fafc,#fff);position:relative;transition:background .2s}
  #dock .dh::before,.pwin .dh::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,var(--ac1),var(--ac2))}
  #dock .dh:hover,.pwin .dh:hover{background:linear-gradient(90deg,#eef2ff,#fff)}
  #dock .ch,.pwin .ch{width:22px;height:22px;border-radius:50%;background:#eef2ff;color:var(--ac1);display:inline-flex;align-items:center;justify-content:center;font-size:11px;transition:transform .25s,background .2s}

  #dock .db,.pwin .db{margin-top:0;padding:10px 14px 14px;max-height:54vh;overflow:auto;transition:max-height .32s cubic-bezier(.2,.8,.2,1),opacity .22s,padding .25s;scrollbar-width:thin}
  #dock .col .db,.pwin .col .db{display:block;max-height:0;opacity:0;padding-top:0;padding-bottom:0;overflow:hidden}
  #dock .col .dh,.pwin .col .dh{border-bottom:0}#dock :not(.col)>.dh,.pwin :not(.col)>.dh{border-bottom:1px solid var(--ln)}
  #dock .col .ch,.pwin .col .ch{transform:rotate(-90deg)}
  .ck{padding:6px 8px;margin:1px 0;border-radius:9px;transition:background .15s,transform .15s;font-size:12.5px}.ck:hover{background:#f1f5f9;transform:translateX(2px)}
  .ck .bx{width:20px;height:20px;border:2px solid #cbd5e1;border-radius:7px;line-height:16px;font-size:12px;transition:all .18s cubic-bezier(.3,1.4,.5,1);margin-right:10px}
  .ck.on .bx{background:linear-gradient(135deg,var(--ac1),#4f46e5);border-color:transparent;color:#fff;box-shadow:0 3px 8px rgba(79,70,229,.45);transform:scale(1.04)}
  #cap .sub{margin:2px 0 8px 12px;padding-left:10px;border-left:2px solid #e0e7ff;transition:opacity .2s}
  #dock .btnrow,.pwin .btnrow{gap:6px;margin-top:10px}
  #dock .btnrow>button,#dock .seg button,#trf .btnrow button,.pwin .btnrow>button,.pwin .seg button{padding:6px 11px;border-radius:99px;font-size:11.5px;font-weight:700;background:#f1f5f9;color:#334155;transition:all .16s;box-shadow:inset 0 0 0 1px #e2e8f0}
  #dock .btnrow>button:hover,#dock .seg button:hover,#trf .btnrow button:hover,.pwin .btnrow>button:hover,.pwin .seg button:hover{background:#e0e7ff;color:#3730a3;transform:translateY(-1px);box-shadow:inset 0 0 0 1px #c7d2fe,0 3px 8px rgba(99,102,241,.2)}

  #dock .btnrow>button:active,#dock .seg button:active,.pwin .btnrow>button:active,.pwin .seg button:active{transform:scale(.96)}
  #dock .seg,.pwin .seg{gap:5px;margin-top:4px}#dock .seg b,.pwin .seg b{width:26px;height:26px;border-radius:8px;background:#eef2ff;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
  #dock input[type=range],.pwin input[type=range]{accent-color:var(--ac1);height:4px}
  #dock select,.pwin select{border:0;background:#f1f5f9;border-radius:99px;padding:5px 10px;font-weight:600;color:#334155;box-shadow:inset 0 0 0 1px #e2e8f0;cursor:pointer;transition:box-shadow .15s}#dock select:hover,.pwin select:hover{box-shadow:inset 0 0 0 1px #a5b4fc}
  #rgp{font-size:12px}#rgp b{color:var(--ink)}#rgp a{color:var(--ac1)!important}
  #trf #trf-i{background:#f8fafc;border:1px solid var(--ln);border-radius:10px;padding:8px 10px;margin-top:8px}
  #trf #trf-i:empty{display:none}
  #dock>#cap .db>.ck:first-child,#dock>#cap .db>.ck[data-k=mapa]{font-weight:800;color:var(--ink);background:linear-gradient(90deg,#eef2ff,rgba(238,242,255,0));margin-top:2px}
  @media (max-width:760px){#dock{width:88vw}#dock-tg{left:88vw}}

  /* ventanitas emergentes */

  .ico .pwc .pwl{display:none}.ico .pwc{padding:0 9px}.pwc .pwl{font-size:12px;letter-spacing:.1px}.pwc:hover{transform:translateX(2px);background:#1e293b}.pwc.on{background:linear-gradient(135deg,#6366f1,#4f46e5)}
