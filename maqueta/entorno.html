  const tt = document.getElementById('tt'); if (tt) { const t = document.createElement('div'); t.className = 'tt-tools'; t.innerHTML = '<button id="dk-c" title="Contraer todo">⤒</button><button id="dk-e" title="Expandir todo">⤓</button>'; tt.appendChild(t); const sec = () => [...dk.children].filter(e => e.querySelector && e.querySelector(':scope > .dh')); document.getElementById('dk-c').onclick = () => sec().forEach(e => { e.dataset.col = '1'; e.classList.add('col'); }); document.getElementById('dk-e').onclick = () => sec().forEach(e => { e.dataset.col = '0'; e.classList.remove('col'); }); } })();
</script>
</body>
</html>
