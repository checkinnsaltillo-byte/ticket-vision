<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maqueta urbana</title>
<style>
  :root{color-scheme:light}

  body{background:radial-gradient(ellipse at 50% 40%,#d2d2d2 0%,#bdbdbd 55%,#a9a9a9 100%)}

  .bar button:hover{background:rgba(15,23,42,.08)}.bar button.on{background:#0f172a;color:#fff}.bar button.rec{color:#b91c1c}
  .tt{position:fixed;left:20px;top:16px;color:#3f3f46;font-weight:800;letter-spacing:.02em}.tt small{display:block;font-weight:600;color:#71717a}
  #msg{position:fixed;left:20px;bottom:18px;color:#52525b;font-size:12px;max-width:30vw}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#52525b;font-weight:700;background:rgba(190,190,190,.7);transition:opacity .4s}
</style>
