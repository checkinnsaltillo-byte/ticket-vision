<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maqueta urbana</title>
<style>
  :root{color-scheme:light}
  html,body{margin:0;height:100%;background:#b9b9b9;overflow:hidden;font:13px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  body{background:radial-gradient(ellipse at 50% 40%,#d2d2d2 0%,#bdbdbd 55%,#a9a9a9 100%)}
  canvas{display:block;width:100vw;height:100vh;cursor:grab}canvas:active{cursor:grabbing}
  .bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;padding:7px;border-radius:99px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.18)}

  .bar button:hover{background:rgba(15,23,42,.08)}.bar button.on{background:#0f172a;color:#fff}.bar button.rec{color:#b91c1c}
  .tt{position:fixed;left:20px;top:16px;color:#3f3f46;font-weight:800;letter-spacing:.02em}.tt small{display:block;font-weight:600;color:#71717a}
  #msg{position:fixed;left:20px;bottom:18px;color:#52525b;font-size:12px}
</style>
</head>
<body>
<div class="tt">MAQUETA URBANA<small>Arrastra para girar · rueda para acercar</small></div>
<div class="bar"><button id="b-rot" class="on">⟳ Giro</button><button id="b-gen">🎲 Otra maqueta</button><button id="b-rec" class="rec">⏺ Grabar video (10 s)</button></div>
<div id="msg"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });

renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.outputColorSpace = THREE.SRGBColorSpace;

const sun = new THREE.DirectionalLight(0xfff1de, 2.6); sun.position.set(60, 90, 45); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); const sc = sun.shadow.camera; sc.left = -62; sc.right = 62; sc.top = 52; sc.bottom = -52; sc.near = 10; sc.far = 260; sun.shadow.bias = -.0004; sun.shadow.normalBias = .04; sun.shadow.radius = 3;

const fill = new THREE.DirectionalLight(0xdfe8ff, .55); fill.position.set(-60, 40, -40); scene.add(fill);

// ───────── texturas procedurales ─────────
const mkTex = (w, h, fn, rep) => { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; if (rep) t.repeat.set(rep[0], rep[1]); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };

const roofTex = mkTex(256, 256, (g, w, h) => { g.fillStyle = '#a4573b'; g.fillRect(0, 0, w, h); for (let x = 0; x < w; x += 16) { for (let y = 0; y < h; y += 32) { const v = rr(); g.fillStyle = `rgb(${148 + v * 40},${78 + v * 22},${54 + v * 14})`; g.fillRect(x + 1, y, 14, 32); g.fillStyle = 'rgba(60,30,20,.34)'; g.fillRect(x, y, 2, 32); g.fillRect(x, y + 30, 16, 3); g.fillStyle = 'rgba(255,200,150,.18)'; g.fillRect(x + 5, y + 2, 4, 26); } } });
const wallTex = mkTex(256, 256, (g, w, h) => { g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); for (let k = 0; k < 2600; k++) { g.fillStyle = `rgba(${rr() > .5 ? '120,100,80' : '255,255,255'},${rr() * .07})`; g.fillRect(rr() * w, rr() * h, 3 + rr() * 9, 2 + rr() * 6); } }, [1, 1]);

// ───────── materiales ─────────
const M = {
  roof: new THREE.MeshStandardMaterial({ map: roofTex, roughness: .85, metalness: 0 }),
  glass: new THREE.MeshStandardMaterial({ color: 0x2f3b4a, roughness: .25, metalness: .2 }),
  frame: new THREE.MeshStandardMaterial({ color: 0xf2efe8, roughness: .9 }),
  door: new THREE.MeshStandardMaterial({ color: 0x5a3a22, roughness: .8 }),
  rail: new THREE.MeshStandardMaterial({ color: 0x23272b, roughness: .6, metalness: .4 }),
  trunk: new THREE.MeshStandardMaterial({ color: 0x5b4636, roughness: 1 }),
  cobble: new THREE.MeshStandardMaterial({ map: cobbleTex, roughness: .95 }),
  earth: new THREE.MeshStandardMaterial({ color: 0x4b3a2c, roughness: 1 }),
  earth2: new THREE.MeshStandardMaterial({ color: 0x7a5d44, roughness: 1 }),
  grass: new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }),

const WALLS = [0xf7f3ea, 0xf3eee2, 0xf9f6ef, 0xefe4cf, 0xe8c99a, 0xe9b9a0, 0xd9a384, 0xf1e0b8, 0xdde3dc], SHUT = [0x3f6b4a, 0x5a3a22, 0x3d5a7a, 0x7a3b2e], CAR = [0xf0c419, 0xb3262c, 0xe9e2cf, 0x2e7d7a, 0x3a5a8c, 0xd8d8d8];
const wallMat = c => new THREE.MeshStandardMaterial({ color: c, map: wallTex, roughness: .95 });

let world = null, anim = { cars: [], people: [] };
const lazo = [[-9, -6.2], [15, -6.2], [15, 8.2], [-9, 8.2]]; // circuito alrededor de la plaza
const pathPt = t => { const per = [24, 14.4, 24, 14.4], tot = 76.8; t = ((t % tot) + tot) % tot; let i = 0; while (t > per[i]) { t -= per[i]; i++; } const a = lazo[i], b = lazo[(i + 1) % 4], u = t / per[i]; return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, Math.atan2(-(b[1] - a[1]), (b[0] - a[0]))]; };


function build(seed) {
  if (world) { scene.remove(world); world.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  anim = { cars: [], people: [] };
  const R = rngF(seed), rnd = (a, b) => a + R() * (b - a), pick = a => a[Math.floor(R() * a.length)];
  world = new THREE.Group(); scene.add(world);
  const SX = 80, SZ = 60, TH = 3;
  // base con estratos de tierra
  const top = new THREE.Mesh(new THREE.BoxGeometry(SX, .5, SZ), [M.earth, M.earth, M.cobble, M.earth, M.earth, M.earth]); top.position.y = -.25; top.receiveShadow = true; world.add(top);
  const layer1 = new THREE.Mesh(new THREE.BoxGeometry(SX, 1.2, SZ), M.earth2); layer1.position.y = -1.1; layer1.receiveShadow = true; world.add(layer1);
  const layer2 = new THREE.Mesh(new THREE.BoxGeometry(SX, TH - 1.7, SZ), M.earth); layer2.position.y = -1.7 - (TH - 1.7) / 2; layer2.castShadow = true; world.add(layer2);
  // instancias de detalles
  const win = [], frm = [], shu = [], dor = [], bal = [], roofs = [], walls = [], walls2 = [];
  const q = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), s1 = new THREE.Vector3(1, 1, 1), mtx = new THREE.Matrix4();
  const put = (arr, x, y, z, ry, sx = 1, sy = 1, sz = 1) => { e.set(0, ry, 0); q.setFromEuler(e); p.set(x, y, z); mtx.compose(p, q, s1.set(sx, sy, sz)); arr.push(mtx.clone()); };
  const fachada = (cx, cz, hw, hd, h0, floors, fh, front) => { // ventanas en los cuatro lados; puerta y balcón del frente
    [[0, 1, hw, 0], [0, -1, hw, Math.PI], [1, 0, hd, Math.PI / 2], [-1, 0, hd, -Math.PI / 2]].forEach(([nx, nz, half, ry], idx) => {
      const L = half * 2, n = Math.max(1, Math.floor(L / 2.6)), px = nz !== 0 ? cx : cx + nx * hw, pz = nz !== 0 ? cz + nz * hd : cz;
      const isFront = front === idx;
      for (let f = 0; f < floors; f++) for (let k = 0; k < n; k++) {
        const t = (k + .5) / n - .5, off = t * L, ox = nz !== 0 ? off : 0, oz = nz !== 0 ? 0 : off, y = h0 + f * fh + fh * .56;
        if (isFront && f === 0 && k === Math.floor(n / 2)) { put(dor, px + ox + nx * .03, h0 + 1.1, pz + oz + nz * .03, ry, 1, 1, 1); continue; }
        const X = px + ox + nx * .03, Z = pz + oz + nz * .03;
        put(frm, X, y, Z, ry, 1, 1, 1); put(win, X + nx * .02, y, Z + nz * .02, ry, 1, 1, 1);
        if (R() < .45) { put(shu, X - (nz !== 0 ? .78 : 0) + nx * .04, y, Z - (nz !== 0 ? 0 : -.78) + nz * .04, ry, 1, 1, 1); put(shu, X + (nz !== 0 ? .78 : 0) + nx * .04, y, Z + (nz !== 0 ? 0 : -.78) + nz * .04, ry, 1, 1, 1); }
        if (isFront && f >= 1 && R() < .4) put(bal, X + nx * .35, y - .75, Z + nz * .35, ry, 1, 1, 1);
      }
    });
  };
  const gableGeo = (w, l, h, ov) => { // prisma de dos aguas con el caballete a lo largo de l (eje x local)
    const hw = w / 2 + ov, hl = l / 2 + ov, v = [], uv = [];
    const quad = (a, b, c, d, ul, vl) => { v.push(...a, ...b, ...c, ...a, ...c, ...d); uv.push(0, 0, ul, 0, ul, vl, 0, 0, ul, vl, 0, vl); };
    const sl = Math.hypot(hw, h), ul = (l + 2 * ov) / 3, vl = sl / 2.4;
    quad([-hl, 0, hw], [hl, 0, hw], [hl, h, 0], [-hl, h, 0], ul, vl); quad([hl, 0, -hw], [-hl, 0, -hw], [-hl, h, 0], [hl, h, 0], ul, vl);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.computeVertexNormals(); return g;
  };
  const gableWall = (w, l, h) => { const hw = w / 2, hl = l / 2, v = [-hl, 0, hw, -hl, 0, -hw, -hl, h, 0, hl, 0, -hw, hl, 0, hw, hl, h, 0]; const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); g.computeVertexNormals(); return g; };
  const house = (x0, x1, z0, z1, front, opts = {}) => {
    const w = x1 - x0, d = z1 - z0, cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, floors = opts.floors || (R() < .14 ? 1 : R() < .84 ? 2 : 3), fh = 3.1, h0 = opts.base || 0.6, H = h0 + floors * fh;
    const col = opts.color || pick(WALLS), mat = wallMat(col), g = new THREE.Group(); g.position.set(cx, 0, cz);
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, H, d), mat); body.position.y = H / 2; body.castShadow = body.receiveShadow = true; g.add(body);
    const zocalo = new THREE.Mesh(new THREE.BoxGeometry(w + .1, h0 + .5, d + .1), wallMat(0xcdbfa4)); zocalo.position.y = (h0 + .5) / 2; zocalo.receiveShadow = true; g.add(zocalo);
    const flat = !opts.noFlat && R() < .07;
    if (flat) { const par = new THREE.Mesh(new THREE.BoxGeometry(w + .2, .7, d + .2), mat); par.position.y = H + .35; par.castShadow = true; g.add(par); const inner = new THREE.Mesh(new THREE.BoxGeometry(w - .5, .72, d - .5), M.grass); inner.position.y = H + .36; g.add(inner); for (let k = 0; k < 2; k++) tree(cx + rnd(-w / 3, w / 3), H + .5, cz + rnd(-d / 3, d / 3), rnd(.5, .8), true); }
    else { const along = w >= d, l = along ? w : d, wd = along ? d : w, rh = opts.rh || rnd(2.1, 3.1), geo = gableGeo(wd, l, rh, .45), r = new THREE.Mesh(geo, M.roof); r.position.y = H; r.rotation.y = along ? 0 : Math.PI / 2; r.castShadow = r.receiveShadow = true; g.add(r);
      const gw = new THREE.Mesh(gableWall(wd, l, rh), mat); gw.position.y = H; gw.rotation.y = along ? 0 : Math.PI / 2; gw.castShadow = true; g.add(gw);
      if (R() < .22) { const ch = new THREE.Mesh(new THREE.BoxGeometry(.8, 1.6, .8), wallMat(0xd8c7b0)); ch.position.set(rnd(-l / 4, l / 4) * (along ? 1 : 0), H + rh * .65, rnd(-wd / 4, wd / 4) * (along ? 1 : 0)); if (!along) ch.position.set(rnd(-wd / 4, wd / 4), H + rh * .65, rnd(-l / 4, l / 4)); ch.castShadow = true; g.add(ch); } }
    world.add(g); fachada(cx, cz, w / 2, d / 2, h0, floors, fh, front);
    return { cx, cz, w, d, H };
  };
  const tree = (x, y, z, s, up) => { const t = new THREE.Group(); t.position.set(x, y, z); const tr = new THREE.Mesh(new THREE.CylinderGeometry(.12 * s, .2 * s, 2.2 * s, 6), M.trunk); tr.position.y = 1.1 * s; tr.castShadow = true; t.add(tr);
    for (let k = 0; k < 3; k++) { const c = new THREE.Mesh(new THREE.IcosahedronGeometry((1.5 - k * .22) * s, 1), new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(.25 + R() * .06, .42 + R() * .12, .26 + R() * .1), roughness: 1, flatShading: true })); c.position.set((R() - .5) * .9 * s, (2.5 + k * .9) * s, (R() - .5) * .9 * s); c.castShadow = true; t.add(c); }
    world.add(t); };
  const palm = (x, z, s) => { const t = new THREE.Group(); t.position.set(x, 0, z); const tr = new THREE.Mesh(new THREE.CylinderGeometry(.14 * s, .22 * s, 6 * s, 6), M.trunk); tr.position.y = 3 * s; tr.rotation.z = .08; tr.castShadow = true; t.add(tr);
    for (let k = 0; k < 8; k++) { const l = new THREE.Mesh(new THREE.ConeGeometry(.35 * s, 3.2 * s, 4), new THREE.MeshStandardMaterial({ color: 0x3e6b34, roughness: 1, flatShading: true })); l.position.set(0, 6 * s, 0); l.rotation.set(Math.PI / 2 - .5, 0, k * Math.PI / 4); l.rotation.order = 'ZXY'; l.translateY(1.5 * s); l.castShadow = true; t.add(l); }

  // ───────── manzanas ─────────
  const bloques = [[-38, -12, -28, -8], [-6, 14, -28, -8], [20, 38, -28, -10], [-38, -12, -2, 28], [-6, 14, 12, 28], [20, 38, 10, 28]];
  bloques.forEach(([x0, x1, z0, z1]) => {
    const dep = 7.8; // fondo de lote

    // patio interior
    const px0 = x0 + dep, px1 = x1 - dep, pz0 = z0 + dep, pz1 = z1 - dep;
    if (px1 - px0 > 2 && pz1 - pz0 > 2) { const pat = new THREE.Mesh(new THREE.BoxGeometry(px1 - px0, .1, pz1 - pz0), M.grass); pat.position.set((px0 + px1) / 2, .05, (pz0 + pz1) / 2); pat.receiveShadow = true; world.add(pat); for (let k = 0; k < 4; k++) tree(rnd(px0 + 1, px1 - 1), .1, rnd(pz0 + 1, pz1 - 1), rnd(.8, 1.2)); }
  });

  // ───────── iglesia ─────────
  const ch = new THREE.Group(), cw = wallMat(0xf4efe3); ch.position.set(17, 0, 0);
  const nave = new THREE.Mesh(new THREE.BoxGeometry(15, 8, 9), cw); nave.position.set(8.5, 4, 0); nave.castShadow = nave.receiveShadow = true; ch.add(nave);
  const nr = new THREE.Mesh(gableGeo(9, 15, 3.4, .5), M.roof); nr.position.set(8.5, 8, 0); nr.castShadow = true; ch.add(nr); const ng = new THREE.Mesh(gableWall(9, 15, 3.4), cw); ng.position.set(8.5, 8, 0); ch.add(ng);
  const fac = new THREE.Mesh(new THREE.BoxGeometry(1.2, 10.5, 9.4), cw); fac.position.set(.4, 5.25, 0); fac.castShadow = true; ch.add(fac);
  const frontón = new THREE.Mesh(new THREE.CylinderGeometry(4.7, 4.7, 1.2, 3, 1), cw); frontón.rotation.set(0, 0, Math.PI / 2); frontón.rotation.order = 'ZYX'; frontón.position.set(.4, 10.9, 0); frontón.rotation.set(Math.PI / 2, 0, Math.PI / 2); ch.add(frontón);
  const arco = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, .3, 16, 1, false, 0, Math.PI), M.door); arco.rotation.set(0, 0, Math.PI / 2); arco.rotation.set(Math.PI / 2, 0, Math.PI / 2); arco.position.set(-.3, 3.2, 0); ch.add(arco); const pt = new THREE.Mesh(new THREE.BoxGeometry(.3, 3.2, 3), M.door); pt.position.set(-.3, 1.6, 0); ch.add(pt);
  const ven = new THREE.Mesh(new THREE.CircleGeometry(.9, 20), M.glass); ven.position.set(-.22, 7.4, 0); ven.rotation.y = -Math.PI / 2; ch.add(ven);
  const tw = new THREE.Mesh(new THREE.BoxGeometry(3.6, 14, 3.6), cw); tw.position.set(.2, 7, 5.6); tw.castShadow = true; ch.add(tw);
  const cuerpo2 = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 3), wallMat(0xe9dfc9)); cuerpo2.position.set(.2, 15.5, 5.6); cuerpo2.castShadow = true; ch.add(cuerpo2);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(2.1, 18, 12, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x8f9a92, roughness: .6 })); dome.position.set(.2, 17, 5.6); dome.castShadow = true; ch.add(dome);
  const cruz = new THREE.Mesh(new THREE.BoxGeometry(.18, 1.6, .18), M.rail); cruz.position.set(.2, 19.7, 5.6); ch.add(cruz); const cruz2 = new THREE.Mesh(new THREE.BoxGeometry(.9, .18, .18), M.rail); cruz2.position.set(.2, 19.9, 5.6); ch.add(cruz2);
  const campanario = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.8, 1.9), M.glass); campanario.position.set(-1.65, 15.4, 5.6); ch.add(campanario);
  const anexo = new THREE.Mesh(new THREE.BoxGeometry(8, 5, 5), wallMat(0xf1e6d0)); anexo.position.set(16, 2.5, -7); anexo.castShadow = true; ch.add(anexo); const ar = new THREE.Mesh(gableGeo(5, 8, 2.2, .45), M.roof); ar.position.set(16, 5, -7); ar.castShadow = true; ch.add(ar); const ag = new THREE.Mesh(gableWall(5, 8, 2.2), wallMat(0xf1e6d0)); ag.position.set(16, 5, -7); ch.add(ag);
  world.add(ch);
  // contrafuertes
  for (let k = 0; k < 4; k++) { const b = new THREE.Mesh(new THREE.BoxGeometry(1, 5, .9), cw); b.position.set(17 + 4 + k * 3.6, 2.5, -4.9); b.castShadow = true; world.add(b); }

  // ───────── plaza: árboles, palmeras, faroles, bancas ─────────
  [[-9, -7.5], [-9, 9], [14.5, -7.5], [14.5, 9]].forEach(([x, z]) => tree(x, .1, z, rnd(.9, 1.15)));

  for (let k = 0; k < 7; k++) { const x = rnd(-9, 15), z = rnd(-7.5, 9.5); if (Math.hypot(x - 3, z - 1) > 5) tree(x, .1, z, rnd(.7, 1)); }
  const fa = new THREE.CylinderGeometry(.07, .09, 3.2, 6), fm = M.rail;
  [[-5, 3], [8, 3], [-5, -5], [8, -5], [1.5, 9]].forEach(([x, z]) => { const f = new THREE.Mesh(fa, fm); f.position.set(x, 1.6, z); f.castShadow = true; world.add(f); const l = new THREE.Mesh(new THREE.SphereGeometry(.22, 8, 8), new THREE.MeshStandardMaterial({ color: 0xfff2c8, emissive: 0xffe9a8, emissiveIntensity: .5 })); l.position.set(x, 3.3, z); world.add(l); });
  const fuente = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.8, .6, 20), new THREE.MeshStandardMaterial({ color: 0xcfc8ba, roughness: .9 })); fuente.position.set(3, .3, 1); fuente.castShadow = fuente.receiveShadow = true; world.add(fuente);

  // ───────── instancias de ventanas, marcos, puertas, balcones ─────────
  const inst = (geo, mat, arr, shadow) => { if (!arr.length) return; const m = new THREE.InstancedMesh(geo, mat, arr.length); arr.forEach((a, i) => m.setMatrixAt(i, a)); m.castShadow = !!shadow; m.receiveShadow = true; world.add(m); };
  inst(new THREE.PlaneGeometry(.9, 1.5), M.glass, win); inst(new THREE.PlaneGeometry(1.15, 1.8), M.frame, frm);
  inst(new THREE.PlaneGeometry(.45, 1.5), new THREE.MeshStandardMaterial({ color: 0x4a6b4a, roughness: .8, side: THREE.DoubleSide }), shu);
  inst(new THREE.PlaneGeometry(1.5, 2.3), M.door, dor);
  inst(new THREE.BoxGeometry(1.9, .14, .8), new THREE.MeshStandardMaterial({ color: 0xcfc6b4, roughness: .9 }), bal, true);

  // ───────── autos y personas (animados) ─────────
  const carGeo = new THREE.Group(); const mk = col => { const g = new THREE.Group(); const b = new THREE.Mesh(new THREE.BoxGeometry(4, 1, 1.8), new THREE.MeshStandardMaterial({ color: col, roughness: .35, metalness: .3 })); b.position.y = .75; b.castShadow = true; g.add(b); const c = new THREE.Mesh(new THREE.BoxGeometry(2, .85, 1.55), new THREE.MeshStandardMaterial({ color: col, roughness: .35, metalness: .3 })); c.position.set(-.2, 1.65, 0); c.castShadow = true; g.add(c); const v = new THREE.Mesh(new THREE.BoxGeometry(1.8, .55, 1.58), M.glass); v.position.set(-.2, 1.7, 0); g.add(v); [[1.2, .9], [-1.2, .9], [1.2, -.9], [-1.2, -.9]].forEach(([x, z]) => { const w = new THREE.Mesh(new THREE.CylinderGeometry(.38, .38, .3, 10), M.rail); w.rotation.x = Math.PI / 2; w.position.set(x, .38, z); g.add(w); }); return g; };
  for (let k = 0; k < 4; k++) { const g = mk(CAR[k % CAR.length]); g.scale.setScalar(.9); world.add(g); anim.cars.push({ g, t: k * 19.2, v: rnd(2.4, 3.4) }); }
  [[-2, -4, 0], [11.5, 4, Math.PI / 2], [-10, 6, 0]].forEach(([x, z, ry], k) => { const g = mk(CAR[(k + 3) % CAR.length]); g.scale.setScalar(.9); g.position.set(x, 0, z); g.rotation.y = ry; world.add(g); });
  const body = new THREE.CapsuleGeometry(.2, .7, 4, 8), cabeza = new THREE.SphereGeometry(.17, 8, 8), piel = new THREE.MeshStandardMaterial({ color: 0xd9b08c, roughness: .9 }), colores = [0x4a6b8a, 0x8a4b2f, 0xe8e4da, 0x4f6b4a, 0x6b5b8a, 0x9a3b3b, 0x2b3038, 0xc9a94a];
  for (let k = 0; k < 46; k++) { const m = new THREE.Mesh(body, new THREE.MeshStandardMaterial({ color: pick(colores), roughness: .9 })); m.castShadow = true; const x = rnd(-9, 15), z = rnd(-6, 8.5); m.position.set(x, .95, z); const hd = new THREE.Mesh(cabeza, piel); hd.position.y = .67; hd.castShadow = true; m.add(hd); world.add(m); anim.people.push({ m, tx: rnd(-9, 15), tz: rnd(-6, 8.5), v: rnd(.4, 1.1), w: rnd(0, 3) }); }
}

build(11);

// ───────── animación ─────────
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  anim.cars.forEach(c => { c.t += c.v * dt; const [x, z, ry] = pathPt(c.t); c.g.position.set(x, 0, z); c.g.rotation.y = ry; });
  anim.people.forEach(p => { const dx = p.tx - p.m.position.x, dz = p.tz - p.m.position.z, d = Math.hypot(dx, dz); if (d < .4) { p.tx = -9 + Math.random() * 24; p.tz = -6 + Math.random() * 14.5; } else { p.m.position.x += dx / d * p.v * dt; p.m.position.z += dz / d * p.v * dt; p.m.position.y = .95 + Math.abs(Math.sin(t * 6 + p.w)) * .04; } });
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(tick);
}
tick();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); fit(); });

// ───────── controles ─────────
$('b-rot').onclick = e => { controls.autoRotate = !controls.autoRotate; e.target.classList.toggle('on', controls.autoRotate); };
let semilla = 11; $('b-gen').onclick = () => { semilla = Math.floor(Math.random() * 1e6); build(semilla); };
$('b-rec').onclick = async e => {
  const btn = e.target; if (btn.dataset.rec) return; if (!window.MediaRecorder) { $('msg').textContent = 'Este navegador no puede grabar video.'; return; }
  btn.dataset.rec = '1'; const rot = controls.autoRotate, sp = controls.autoRotateSpeed; controls.autoRotate = true; controls.autoRotateSpeed = 5;
  const st = renderer.domElement.captureStream(30), mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)), rec = new MediaRecorder(st, { mimeType: mime, videoBitsPerSecond: 12e6 }), parts = [];
  rec.ondataavailable = ev => ev.data.size && parts.push(ev.data);
  rec.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(parts, { type: 'video/webm' })); a.download = 'maqueta-urbana.webm'; a.click(); controls.autoRotate = rot; controls.autoRotateSpeed = sp; delete btn.dataset.rec; btn.textContent = '⏺ Grabar video (10 s)'; $('msg').textContent = 'Video descargado (formato WebM).'; };
  rec.start(); let s = 10; const iv = setInterval(() => { btn.textContent = `⏺ Grabando… ${--s} s`; if (s <= 0) { clearInterval(iv); rec.stop(); } }, 1000); btn.textContent = '⏺ Grabando… 10 s';
};
</script>
